name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      # Install dependencies
      - name: Install dependencies
        run: go mod tidy

      # Log in to GitHub Container Registry (GHCR) for build
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/easycast:latest
            ghcr.io/${{ github.repository_owner }}/easycast:${{ github.sha }}

      # Deploy to server
      - name: Deploy to server
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/easycast:latest
            docker stop easycast || true
            docker rm easycast || true
            docker run -d --name easycast \
              -e SERVER_PORT=8080 \
              -e LOG_LEVEL=release \
              -e DEBUG=false \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }} \
              -e UT=60s \
              -p 8080:8080 \
              ghcr.io/${{ github.repository_owner }}/easycast:latest
