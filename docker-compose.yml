version: "3.9"

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/easycast:latest
    restart: always
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
